name: 분양정보 자동 업데이트

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 오전 6:17 (한국시간)
    - cron: "17 3 * * *"    # 매일 낮 12:17 (한국시간)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write
  pages: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 청약홈 데이터로 페이지 생성
        env:
          APPLYHOME_KEY: ${{ secrets.APPLYHOME_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          TZ: Asia/Seoul
        run: python _build/generate.py
      - name: 변경사항 저장
        run: |
          git config user.name "visitone-bot"
          git config user.email "visitone-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "분양정보 자동 업데이트 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -X theirs origin main || true
          git push
      - name: 사이트 다시 배포 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
